[project]
name = "routingrepo"
version = "0.1.0"
description = "Learning Vehicle Routing Problems with Google OR-Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ortools>=9.10",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.optional-dependencies]
notebooks = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
    "folium>=0.16",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vrp_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
